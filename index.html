<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milker</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1d1d1f; --muted: #6b6b70; --accent: #2f6fed; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121214; --fg: #f2f2f3; --muted: #9a9aa2; --accent: #6b9bff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main { text-align: center; max-width: 560px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 .25em; }
    p { color: var(--muted); font-size: 1.15rem; line-height: 1.5; }
    .badge {
      display: inline-block; margin-top: 1.5em; padding: .5em 1em;
      border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>🥛 Mikeekr</h1>
    <p>Salut! Pagina e live pe GitHub Pages.</p>
    <span class="badge">Deploy reușit ✓</span>
  </main>
</body>
</html>
